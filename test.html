<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>&#10240;</title>
<style>
@font-face {
font-family: 'MaruMonica';
src: url('x12y16pxMaruMonica.ttf') format('truetype');
}
* {
font-family: 'MaruMonica', sans-serif;
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
background-color: #000000;
overflow: hidden;
width: 100vw;
height: 100vh;
}
#c {
display: block;
width: 100vw;
height: 100vh;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
document.title = "\u2800";
const c = document.getElementById("c");
const x = c.getContext("2d");
let w, h;
const a = [];
const n = 80;
function r() {
w = c.width = window.innerWidth;
h = c.height = window.innerHeight;
}
window.addEventListener("resize", r);
r();
for (let i = 0; i < n; i++) {
a.push({
x: Math.random() * w,
y: Math.random() * h,
s: Math.random() * 20 + 2,
z: Math.floor(Math.random() * 16 + 20)
});
}
function f() {
x.fillStyle = "#000000";
x.fillRect(0, 0, w, h);
x.fillStyle = "#ffffff";
for (let i = 0; i < a.length; i++) {
const p = a[i];
x.font = p.z + "px MaruMonica, sans-serif";
x.fillText("テスト", p.x, p.y);
p.y += p.s;
if (p.y > h + 50) {
p.y = -50;
p.x = Math.random() * w;
}
}
requestAnimationFrame(f);
}
requestAnimationFrame(f);
</script>
