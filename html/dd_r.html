<style>
  @font-face {
    font-family: "Misaki";
    src: url("https://cdn.jsdelivr.net/gh/george-angelov/misaki-font@main/misaki_gothic.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --C0: #000000;
    --C1: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #008080;
    font-family: "Misaki", "MS Gothic", "ＭＳ ゴシック", monospace;
    font-size: 12px;
    -webkit-font-smoothing: none;
    font-smooth: never;
    image-rendering: pixelated;
    padding: 30px;
  }
  #blackout {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    z-index: 9999;
    display: none;
  }
  .raised {
    border-top: 1px solid #ffffff;
    border-left: 1px solid #ffffff;
    border-right: 1px solid #404040;
    border-bottom: 1px solid #404040;
    box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
  }
  .sunken {
    border-top: 1px solid #808080;
    border-left: 1px solid #808080;
    border-right: 1px solid #ffffff;
    border-bottom: 1px solid #ffffff;
    box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
  }
  .ie-window {
    width: 780px;
    margin: 0 auto;
    background: #c0c0c0;
    padding: 3px;
  }
  .title-bar {
    background: linear-gradient(to right, #000080, #1084d0);
    color: #fff;
    display: flex;
    align-items: center;
    height: 22px;
    padding: 0 3px;
    gap: 4px;
  }
  .title-bar .title { flex: 1; font-weight: bold; font-size: 12px; overflow: hidden; white-space: nowrap; }
  .title-bar .buttons { display: flex; gap: 2px; }
  .title-bar .buttons button {
    width: 16px; height: 14px;
    background: #c0c0c0;
    font-family: "Marlett", "MS Gothic", monospace;
    font-size: 9px;
    line-height: 1;
    cursor: pointer;
    border: none;
  }
  .menu-bar { display: flex; background: #c0c0c0; padding: 1px 0; border-bottom: 1px solid #808080; }
  .menu-bar span { padding: 3px 8px; cursor: default; }
  .menu-bar span:hover { background: #000080; color: #fff; }
  .toolbar { display: flex; align-items: center; background: #c0c0c0; padding: 2px 4px; border-bottom: 1px solid #808080; gap: 1px; }
  .tb-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 48px; height: 42px; background: transparent;
    border: 1px solid transparent; cursor: pointer; font-family: inherit; font-size: 11px; gap: 1px;
  }
  .tb-btn:hover { border-top: 1px solid #ffffff; border-left: 1px solid #ffffff; border-right: 1px solid #808080; border-bottom: 1px solid #808080; }
  .tb-btn:active { border-top: 1px solid #808080; border-left: 1px solid #808080; border-right: 1px solid #ffffff; border-bottom: 1px solid #ffffff; }
  .tb-btn .icon { line-height: 0; }
  .tb-btn.disabled { color: #808080; opacity: 0.5; }
  .tb-btn.disabled svg { opacity: 0.4; }
  .tb-sep { width: 1px; height: 38px; background: #808080; border-right: 1px solid #ffffff; margin: 0 3px; }
  .address-bar { display: flex; align-items: center; background: #c0c0c0; padding: 2px 4px; gap: 6px; border-bottom: 1px solid #808080; }
  .address-bar label { white-space: nowrap; }
  .address-bar .address-field { flex: 1; display: flex; align-items: center; background: #ffffff; height: 22px; padding: 0 3px; gap: 4px; }
  .address-field input { flex: 1; border: none; outline: none; font-family: inherit; font-size: 12px; -webkit-font-smoothing: none; }
  .address-field .drop { width: 16px; height: 18px; background: #c0c0c0; font-size: 9px; cursor: pointer; border: none; }
  .go-btn { display: flex; align-items: center; height: 22px; padding: 0 10px; background: transparent; border: 1px solid transparent; font-family: inherit; cursor: pointer; }
  .go-btn:hover { border-top: 1px solid #fff; border-left: 1px solid #fff; border-right: 1px solid #808080; border-bottom: 1px solid #808080; }
  .page {
    background: var(--C0);
    height: 440px;
    overflow-y: auto;
    padding: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  .page::-webkit-scrollbar { display: none; }
  .status-bar { display: flex; background: #c0c0c0; padding: 2px; gap: 2px; }
  .status-bar .pane { padding: 2px 6px; height: 20px; display: flex; align-items: center; gap: 4px; }
  .status-bar .main { flex: 1; }
  .k {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100%;
    padding-top: 20px;
  }
  .k .qr {
    max-width: 180px;
    image-rendering: pixelated;
  }
  .k img#ie {
    max-width: 120px;
    cursor: pointer;
    image-rendering: pixelated;
    margin-top: auto;
    margin-bottom: 30px;
  }
  .tb-btn svg, .title-bar svg, .address-field svg, .status-bar svg {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
</style>
</head>
