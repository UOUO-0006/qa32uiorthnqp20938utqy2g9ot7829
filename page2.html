<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 検索エンジンに引っかからないようにする設定（noindex） -->
  <meta name="robots" content="noindex, nofollow">
  <title>Rotated Image Page</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
      font-family: sans-serif;
    }
    .rotate-img {
      max-width: 100%;
      height: auto;
      max-height: 70vh;
      margin-bottom: 20px;
      display: block;
      /* CSSで画像をグルグル連続回転させる設定 */
      animation: spin 4s linear infinite;
    }
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    a {
      color: #ffffff;
      font-size: 2rem;
      text-decoration: none;
      line-height: 1;
    }
    a:hover {
      color: #cccccc;
    }
  </style>
</head>
<body>
  <img src="image.png" alt="回転する添付画像" class="rotate-img">
  <!-- 最初のページに戻るリンク -->
  <a href="index.html">■</a>
</body>
</html>
