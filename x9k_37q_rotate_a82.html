<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>&#10240;</title>
  <style>
    * {
      font-family: 'マルモニカ', 'Marumonika', monospace, sans-serif;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
    }
    .i {
      max-width: 90%;
      height: auto;
      max-height: 45vh;
      margin-top: 20px;
      display: block;
      animation: s 4s linear infinite;
    }
    @keyframes s {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .c {
      position: absolute;
      top: 65vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .t {
      color: #ffffff;
      font-size: 2rem;
      line-height: 1;
    }
    a {
      color: #0000FF;
      font-size: 2rem;
      text-decoration: underline;
      line-height: 1;
    }
    a:visited {
      color: #0000FF;
    }
    a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <img src="image.png" alt="" class="i">
  <div class="c">
    <div class="t">ドンドコタコス</div>
    <a href="index.html">■</a>
  </div>
  <script>
    document.title = "\u2800";
  </script>
</body>
</html>
