<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>&#10240;</title>
<style>
@font-face {
font-family:'MaruMonica';
src:url('x12y16pxMaruMonica.ttf') format('truetype');
}
* {
font-family:'MaruMonica', sans-serif;
}
body {
background-color:#000000;
color:#ffffff;
margin:0;
padding:20px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
min-height:100vh;
box-sizing: border-box;
position: relative;
}
.c {
position: absolute;
top:65vh;
display: flex;
flex-direction: row;
align-items: center;
gap:30px;
}
a {
color:rgb(50, 117, 198);
font-size:3rem;
text-decoration: underline;
line-height:1;
cursor: pointer;
}
a:visited {
color:rgb(50, 117, 198);
}
a:hover {
opacity:0.8;
}
.s {
display: flex;
flex-direction: row;
align-items: center;
gap:10px;
}
.n {
font-size:2rem;
cursor: pointer;
color:#ffffff;
}
.i {
max-width:120px;
max-height:120px;
}
</style>
</head>
<body>
<div class="c">
<audio id="a" src="midi/maybe.mid" preload="auto" controls></audio>
<div class="s">
<span class="n" id="p">◀</span>
<img class="i" id="g" src="image/maybe.png" alt="">
<span class="n" id="x">▶</span>
</div>
<a id="l">■</a>
</div>
<script>
document.title="\u2800";
var c=["beam","ddbbs","maybe","me","mirror","ninV","osetuma","saiki","toi"];
var d=2;
var g=document.getElementById("g");
var a=document.getElementById("a");
a.volume=0.5;
document.getElementById("p").addEventListener("click",function(){
d=(d-1+c.length)%c.length;
g.src="image/"+c[d]+".png";
});
document.getElementById("x").addEventListener("click",function(){
d=(d+1)%c.length;
g.src="image/"+c[d]+".png";
});
var p1="T0suaHRtbA==";
var p2="YnViYnUtLmh0bWw=";
document.getElementById("l").addEventListener("click",function(){
if(c[d]==="maybe"){
window.location.href=atob(p1);
}else{
window.location.href=atob(p2);
}
});
</script>
</body>
</html>
