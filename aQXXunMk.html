<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>&#10240;</title>
  <style>
    @font-face {
      font-family: 'MaruMonica';
      src: url('x12y16pxMaruMonica.ttf') format('truetype');
    }
    * {
      font-family: 'MaruMonica', sans-serif;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
    }
    .i {
      max-width: 90%;
      height: auto;
      max-height: 45vh;
      margin-top: 20px;
      display: block;
      animation: s 4s linear infinite;
    }
    @keyframes s {
      0%   { transform: rotate(0deg); }
      1.5% { transform: rotate(45deg); }
      12.5%{ transform: rotate(45deg); }
      14%  { transform: rotate(90deg); }
      25%  { transform: rotate(90deg); }
      26.5%{ transform: rotate(135deg); }
      37.5%{ transform: rotate(135deg); }
      39%  { transform: rotate(180deg); }
      50%  { transform: rotate(180deg); }
      51.5%{ transform: rotate(225deg); }
      62.5%{ transform: rotate(225deg); }
      64%  { transform: rotate(270deg); }
      75%  { transform: rotate(270deg); }
      76.5%{ transform: rotate(315deg); }
      87.5%{ transform: rotate(315deg); }
      89%  { transform: rotate(360deg); }
      100% { transform: rotate(360deg); }
    }
    .c {
      position: absolute;
      top: 65vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .t {
      color: #ffffff;
      font-size: 2rem;
      line-height: 1;
    }
    a {
      color: #0000FF;
      font-size: 2rem;
      text-decoration: underline;
      line-height: 1;
      cursor: pointer;
    }
    a:visited {
      color: #0000FF;
    }
    a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <img src="image.png" alt="" class="i">
  <div class="c">
    <div class="t">ドンドコタコス</div>
    <a id="l">■</a>
  </div>
  <script>
    document.title = "\u2800";
    const p = "TjBoQkg3TEsuaHRtbA==";
    document.getElementById("l").addEventListener("click", function() {
      window.location.href = atob(p);
    });
  </script>
</body>
</html>
